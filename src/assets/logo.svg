<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Pecuniae logo</title>
  <desc id="desc">A circular blue finance symbol with incoming and outgoing transaction arrows beside the word Pecuniae.</desc>

  <defs>
    <linearGradient id="coin" x1="40" y1="32" x2="274" y2="286" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58ADFF"/>
      <stop offset="1" stop-color="#1687F8"/>
    </linearGradient>
    <linearGradient id="flow" x1="88" y1="80" x2="232" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EFF7FF"/>
      <stop offset="1" stop-color="#B9DDFF"/>
    </linearGradient>
    <filter id="shadow" x="18" y="18" width="284" height="294" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#07559F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Coin / transaction mark -->
  <g filter="url(#shadow)">
    <circle cx="160" cy="150" r="116" fill="url(#coin)"/>
    <circle cx="160" cy="150" r="95" stroke="#D9ECFF" stroke-opacity="0.55" stroke-width="3"/>
  </g>

  <!-- Two balanced money-flow arrows form a subtle P -->
  <path d="M105 169C105 132.55 134.55 103 171 103H210" stroke="url(#flow)" stroke-width="22" stroke-linecap="round"/>
  <path d="M190 82L217 103L190 124" stroke="#EFF7FF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M215 139C215 175.45 185.45 205 149 205H110" stroke="url(#flow)" stroke-width="22" stroke-linecap="round"/>
  <path d="M130 226L103 205L130 184" stroke="#B9DDFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="322" y="202" fill="#1687F8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="128" font-weight="700" letter-spacing="-5">Pecuniae</text>
</svg>
